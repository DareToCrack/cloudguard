services:
  cloudguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudguard:latest
    container_name: cloudguard-api
    ports:
      - "8000:8000"
    environment:
      CLOUDGUARD_ENVIRONMENT: production
      CLOUDGUARD_DEBUG: "false"
      CLOUDGUARD_DATABASE_URL: sqlite:////data/cloudguard.db
      CLOUDGUARD_AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Uncomment to scan a real AWS account instead of demo mode - the
      # container will otherwise use the AWS credential chain automatically
      # if you mount ~/.aws (see the volume below) or pass keys via env:
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
    volumes:
      - cloudguard-data:/data
      # Uncomment to scan using your local AWS CLI credentials (read-only mount):
      # - ${HOME}/.aws:/home/cloudguard/.aws:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  cloudguard-data:
